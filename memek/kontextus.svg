<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="675" fill="#fbe9d4"/>
  <text x="600" y="82" fill="#11201f" font-size="44" font-weight="800" text-anchor="middle">„1 millió token kontextus!”</text>
  <!-- iratkupac -->
  <g fill="#ffffff" stroke="#b7c7c9" stroke-width="3">
    <rect x="120" y="300" width="300" height="60" rx="6"/>
    <rect x="140" y="250" width="300" height="60" rx="6"/>
    <rect x="110" y="200" width="300" height="60" rx="6"/>
    <rect x="150" y="150" width="300" height="60" rx="6"/>
    <rect x="125" y="360" width="300" height="60" rx="6"/>
    <rect x="135" y="420" width="300" height="60" rx="6"/>
  </g>
  <text x="285" y="540" fill="#11201f" font-size="28" font-weight="700" text-anchor="middle">Én: bemásolom</text>
  <text x="285" y="578" fill="#11201f" font-size="28" font-weight="700" text-anchor="middle">a cég teljes Drive-ját</text>
  <!-- nyíl -->
  <path d="M500 330 H650" stroke="#0a6b78" stroke-width="10" stroke-linecap="round"/>
  <path d="M630 300 L680 330 L630 360 Z" fill="#0a6b78"/>
  <!-- válasz buborék -->
  <rect x="720" y="210" width="420" height="230" rx="24" fill="#0b3940"/>
  <text x="930" y="270" fill="#9fc4c8" font-size="24" text-anchor="middle">A modell összefoglalója:</text>
  <text x="930" y="345" fill="#e8f4f5" font-size="40" font-weight="800" text-anchor="middle">„Sok</text>
  <text x="930" y="395" fill="#e8f4f5" font-size="40" font-weight="800" text-anchor="middle">dokumentum.”</text>
  <text x="930" y="540" fill="#4c605f" font-size="24" text-anchor="middle">(és minden kérésnél újra kifizeted)</text>
</svg>
