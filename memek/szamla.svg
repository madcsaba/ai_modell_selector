  <rect x="710" y="340" width="340" height="170" rx="10" fill="#ffffff" stroke="#0a6b78" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="880" y="385" fill="#4c605f" font-size="22" text-anchor="middle">HAVI SZÁMLA</text>
  <text x="880" y="460" fill="#2f7a3a" font-size="64" font-weight="800" text-anchor="middle">$4</text>
  <text x="600" y="620" fill="#e8f4f5" font-size="34" font-style="italic" text-anchor="middle">„De legalább nagyon alaposan átgondolta.”</text>
