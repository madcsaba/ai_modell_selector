name: Mémsarok frissítése

# Lekéri a memek/fortepan.json-ban beállított Fortepan-keresések találatait a memek/fortepan.js-be:
# a fortepan.json változásakor, hetente egyszer és kézi indításkor.
on:
  push:
    branches: [main]
    paths:
      - "memek/fortepan.json"
      - "memek/fortepan.mjs"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fortepan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fortepan-keresések (memek/fortepan.json)
        run: node memek/fortepan.mjs
      - name: Változás visszacommitolása
        run: |
          if git diff --quiet -- memek/fortepan.js; then
            echo "Nincs változás."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memek/fortepan.js
          git commit -m "Fortepan-lista frissítése"
          git push
